name: Build and test code
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, windows-latest]
        golang-version: ["1.27.3"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup golang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "${{ matrix.golang-version }}"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: ${{ matrix.os }}-${{ matrix.golang-version }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.golang-version }}-go-
      - run: mkdir cmd/test_artifacts
      - run: go mod verify
      - run: go test -mod=readonly -p=2 -v -cover ./...
